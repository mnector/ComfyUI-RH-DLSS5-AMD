[project]
name = "ComfyUI-RH-DLSS5-AMD"
description = "DLSS 5 Neural Rendering (NGX feature 18) enhance/upscale plus temporal frame interpolation adapted for AMD GPUs on Windows (ZLUDA / ROCm / HIP bridge via OptiScaler and OpenCV DIS) for ComfyUI IMAGE and VIDEO."
version = "1.0.0"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "opencv-python",
]

[project.urls]
Repository = "https://github.com/mnector/ComfyUI-RH-DLSS5-AMD"
Upstream = "https://github.com/RH-RunningHub/ComfyUI-RH-DLSS5"

[tool.comfy]
PublisherId = "mnector"
DisplayName = "ComfyUI-RH-DLSS5-AMD"
Icon = ""
includes = ["examples", "native", "runtime/caller"]
